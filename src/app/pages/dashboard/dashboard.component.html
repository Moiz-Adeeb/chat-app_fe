<div class="bg-[#f7f7f7] dark:bg-[#f7f7f7] min-h-screen transition-colors">
  <!-- Header -->
  <app-header class="z-[100]"></app-header>

  <div class="flex pt-20 sm:pt-24 md:pt-28 lg:pt-32">
    <!-- Sidebar -->
    <!-- Desktop Sidebar ONLY (completely hidden on mobile/tablet) -->
    <div class="hidden lg:block">
      <app-sidebar
        [sidebarCollapsed]="sidebarCollapsed"
        class="top-0 left-0 z-40 fixed h-screen"
        [ngClass]="{
          'w-64': !sidebarCollapsed,
          'w-20': sidebarCollapsed
        }">
      </app-sidebar>
    </div>

    <!-- Mobile Sidebar Overlay (only visible when menu is open on mobile/tablet) -->
    <div
      *ngIf="mobileSidebarOpen"
      (click)="sidebarService.closeMobileSidebar()"
      class="lg:hidden z-50 fixed inset-0 bg-black/50 backdrop-blur-sm"
      [@fadeIn]>
    </div>

    <!-- Mobile Sidebar Drawer (ONLY on mobile/tablet) -->
    <div
      *ngIf="mobileSidebarOpen"
      class="lg:hidden top-0 bottom-0 left-0 z-50 fixed w-64 shadow-2xl">
      <app-sidebar
        [sidebarCollapsed]="false"
        class="w-full h-full animate-slide-in">
      </app-sidebar>
    </div>

    <!-- Main Content -->
    <main
      class="flex-1 w-full min-h-[calc(100vh-5rem)] sm:min-h-[calc(100vh-6rem)] md:min-h-[calc(100vh-7rem)] lg:min-h-[calc(100vh-8rem)] overflow-x-hidden overflow-y-auto transition-all duration-300 ease-in-out"
      [ngClass]="{
        'lg:ml-[266px]': !sidebarCollapsed,
        'lg:ml-[92px]': sidebarCollapsed
      }">
      <div class="px-3 sm:px-4 md:px-6 lg:px-7 py-4 sm:py-5 md:py-6 lg:py-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
