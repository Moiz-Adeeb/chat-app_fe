<div class="flex w-screen h-screen overflow-hidden bg-primary-light">

  <!-- Left Panel — Form -->
	<div class="flex flex-col justify-center items-center border-[12px] lg:border-[20px] p-4 rounded-[40px] lg:rounded-[64px] border-primary-light bg-slate-100 dark:bg-slate-700 px-6 sm:px-10 w-full lg:w-1/2 h-full">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <div class="flex items-center gap-2">
					<div class="flex justify-center items-center rounded-full h-12">
						<img
              src="/assets/img/billing_benefit_logo.png"
              alt="Billing Benefit"
              class="rounded-full w-full h-full object-cover dark:invert"
            >
					</div>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="mb-1 font-bold text-slate-900 text-2xl">Forgot Password</h1>
      <p class="mb-4 text-slate-500 text-sm">
        Enter your email address and we'll send you a reset link.
      </p>

      <form action="forgot-password" class="flex flex-col gap-4">
        <!-- Email -->
        <app-text-field
          [fieldControl]="emailControl"
          [placeholder]="'Enter Your Email Here'"
          [fieldName]="'Email'"
          fieldType="email"
          (keyup.enter)="onResetPasswordPage()"
        ></app-text-field>

        <!-- Security Notice -->
        <div class="bg-slate-50 p-3 border border-slate-200 rounded-lg">
          <div class="flex items-start gap-2">
            <svg class="flex-shrink-0 mt-0.5 w-4 h-4 text-slate-400" fill="currentColor" viewBox="0 0 512 512">
              <path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM216 336h24V272H216c-13.3 0-24-10.7-24-24s10.7-24 24-24h48c13.3 0 24 10.7 24 24v88h8c13.3 0 24 10.7 24 24s-10.7 24-24 24H216c-13.3 0-24-10.7-24-24s10.7-24 24-24zm40-208a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/>
            </svg>
            <div class="text-slate-600 text-xs">
              <p class="mb-1 font-medium">Secure Reset</p>
              <p>Password reset links are valid for 15 minutes.</p>
            </div>
          </div>
        </div>

        <!-- Reset Password Button -->
				<app-button
          type="custom"
          width="100%"
          fontSize="14px"
          fontFamily="montserrat"
          [bgColor]="'var(--color-primary)'"
          [hoverBgColor]="'var(--color-white)'"
          [borderWidth]="'2px'"
          [borderColor]="'#f97316'"
          [hoverBorderColor]="'#000'"
          [textColor]="'#fff'"
          [hoverTextColor]="'#000'"
          radius="10px"
          padding="12px 16px"
          (clicked)="onResetPasswordPage()"
        >
          Send Reset Email
        </app-button>

        <!-- Back to Login -->
        <p class="text-slate-600 text-sm text-center">
          <span (click)="onBackToLogin()" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-700 hover:underline transition-colors cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 512 512">
              <path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l128 128c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.3 288 480 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-370.7 0 73.4-73.4c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-128 128z"/>
            </svg>
            Back to Login
          </span>
        </p>
      </form>

      <!-- Footer -->
      <p class="mt-10 text-slate-400 text-xs text-center">
        Copyright © 2026 <span class="font-medium text-slate-500">Billing Benefit</span>. All rights reserved
      </p>
    </div>
  </div>

	<!-- Right Panel — Decorative -->
	<div class="hidden lg:flex relative justify-center items-center bg-primary-light w-1/2 h-full overflow-hidden">
		<img
      src="/assets/img/login-page/right-half.png"
      alt="Billing Benefit"
      class="rounded-full w-[92%] h-[92%] object-cover"
    >
	</div>
</div>
